<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konstantin · Dein KI-Kompass – Logo-Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ground:#2A1B3D; --main:#F2C94C; --second:#F5F0FA; --accent:#7FD1C7; }
  html, body { margin:0; height:100%; background:var(--ground); overflow:hidden; }
  .viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1920px; height:1080px; flex:none; transform-origin:50% 50%;
    color:var(--second); font-family:"Public Sans", system-ui, sans-serif; overflow:hidden; background:var(--ground); }
  .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .deg { stroke:color-mix(in srgb, var(--second) 26%, transparent); stroke-width:2; stroke-linecap:round; }
  .deg-major { stroke:color-mix(in srgb, var(--main) 55%, var(--ground)); stroke-width:3; }
  .ripple { fill:none; stroke:var(--accent); }
  .kl-wrap { position:absolute; left:680px; top:260px; width:560px; height:560px; transform-origin:50% 50%; }
  .kl { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .kl-ring { fill:none; stroke:var(--second); stroke-width:6; stroke-linecap:round; transform-box:fill-box; transform-origin:center; transform:rotate(-90deg); }
  .kl-t { stroke:var(--second); stroke-width:4; stroke-linecap:round; transform-box:fill-box; transform-origin:center; }
  .kl-needle { transform-box:view-box; transform-origin:60px 60px; }
  .kl-tail { fill:var(--second); transform-box:fill-box; transform-origin:50% 0%; }
  .kl-shaft { stroke:var(--main); stroke-width:6; stroke-linecap:round; transform-box:fill-box; transform-origin:50% 100%; }
  .kl-bit { fill:var(--main); transform-box:fill-box; transform-origin:0% 50%; }
  .kl-bow { fill:var(--ground); stroke:var(--main); stroke-width:6; transform-box:fill-box; transform-origin:center; }
  .words { position:absolute; left:744px; top:356px; width:1080px; margin:0; display:flex; flex-direction:column; gap:24px; }
  .words > * { margin:0; }
  .mark { font-family:"Archivo", system-ui, sans-serif; font-weight:800; font-size:172px; line-height:.95; letter-spacing:-.025em; color:var(--second); }
  .tag { font-family:"Archivo", system-ui, sans-serif; font-weight:700; font-size:42px; letter-spacing:.3em; color:var(--main); }
  .rule { height:6px; width:150px; border-radius:3px; background:var(--accent); transform-origin:0 50%; }
  .claim { font-size:40px; font-weight:400; color:color-mix(in srgb, var(--second) 72%, var(--ground)); }
  .claim span { display:inline-block; white-space:pre; }
  .replay { position:fixed; right:20px; bottom:20px; font:600 15px "Public Sans", system-ui, sans-serif; color:var(--second);
    background:color-mix(in srgb, var(--second) 12%, transparent); border:1px solid color-mix(in srgb, var(--second) 30%, transparent);
    border-radius:999px; padding:9px 16px; cursor:pointer; opacity:0; transition:opacity .3s; }
  .replay.show { opacity:1; }
  .replay:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<div class="viewport">
  <div id="stage" role="img" aria-label="Konstantin, dein KI-Kompass: Ein Kompass zeichnet sich, eine Schlüsselnadel sucht und rastet auf Nordost ein, dann erscheint der Name mit dem Claim Beständig orientiert in der Welt der KI.">
    <svg class="art" viewBox="0 0 1920 1080" aria-hidden="true">
      <g id="deg"></g>
      <circle id="r1" class="ripple" cx="960" cy="540" r="250" stroke-width="4" opacity="0"/>
      <circle id="r2" class="ripple" cx="960" cy="540" r="250" stroke-width="2" opacity="0"/>
    </svg>
    <div class="kl-wrap" id="wrap" aria-hidden="true">
      <svg class="kl" viewBox="0 0 120 120">
        <circle class="kl-ring" id="ring" cx="60" cy="60" r="52" pathLength="100"/>
        <line class="kl-t" x1="60" y1="15" x2="60" y2="23"/>
        <line class="kl-t" x1="105" y1="60" x2="97" y2="60"/>
        <line class="kl-t" x1="60" y1="105" x2="60" y2="97"/>
        <line class="kl-t" x1="15" y1="60" x2="23" y2="60"/>
        <g class="kl-needle" id="needle">
          <polygon class="kl-tail" id="tail" points="56,73 64,73 60,97"/>
          <line class="kl-shaft" id="shaft" x1="60" y1="49" x2="60" y2="22"/>
          <polygon class="kl-bit" id="bit" points="62,22 71,22 71,28 67,28 67,33 62,33"/>
          <circle class="kl-bow" id="bow" cx="60" cy="60" r="11"/>
        </g>
      </svg>
    </div>
    <div class="words" id="words">
      <h1 class="mark" id="mark">Konstantin</h1>
      <p class="tag" id="tag">DEIN KI-KOMPASS</p>
      <div class="rule" id="rule"></div>
      <p class="claim" id="claim">Beständig orientiert in der Welt der KI</p>
    </div>
  </div>
</div>
<button class="replay" id="replay" type="button">Erneut abspielen</button>

<script>
(function () {
  // Zeitleiste (Sekunden): Ring 0–3, Nadel sucht 3–7.5, Einrasten 7.5–10, Name 10–15
  const T = { ring: 0, suche: 3, einrasten: 7.5, name: 10, end: 15 };

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eob = (x, o = 1.4) => x <= 0 ? 0 : 1 + (o + 1) * Math.pow(x - 1, 3) + o * Math.pow(x - 1, 2);
  const breathe = (t, amt, period) => 1 + amt * Math.sin(2 * Math.PI * t / period);

  const $ = id => document.getElementById(id);
  const stage = $('stage');

  // Gradstriche
  let s = '';
  for (let i = 0; i < 72; i++) {
    const a = i * 5 * Math.PI / 180, major = i % 9 === 0, l = major ? 26 : 12, r = 312;
    s += '<line class="deg' + (major ? ' deg-major' : '') + '" x1="' + (960 + Math.sin(a) * r).toFixed(1) + '" y1="' + (540 - Math.cos(a) * r).toFixed(1) +
      '" x2="' + (960 + Math.sin(a) * (r + l)).toFixed(1) + '" y2="' + (540 - Math.cos(a) * (r + l)).toFixed(1) + '"/>';
  }
  const deg = $('deg'); deg.innerHTML = s; deg.style.transformOrigin = '960px 540px';

  const ring = $('ring'), ticks = [...document.querySelectorAll('.kl-t')], wrap = $('wrap').style;
  const needle = $('needle').style, bow = $('bow').style, shaft = $('shaft').style, bit = $('bit').style, tail = $('tail').style;
  const r1 = $('r1'), r2 = $('r2');
  const words = $('words').style, mark = $('mark').style, tag = $('tag').style, rule = $('rule').style;

  // Claim in Wörter teilen (einblenden von rechts)
  const claimEl = $('claim');
  const claimWords = claimEl.textContent.split(' ');
  claimEl.innerHTML = claimWords.map((w, i) => '<span>' + w + (i < claimWords.length - 1 ? ' ' : '') + '</span>').join('');
  const claimSpans = [...claimEl.children];

  function render(t) {
    // --- Gradstriche ---
    let degRot, degOp = 1;
    if (t < T.suche) { degRot = lerp(-14, 0, eio(seg(t, -0.6, 2.4))) + t * 0.6; degOp = eo(seg(t, -0.6, 0.4)); }
    else if (t < T.einrasten) degRot = 1.8 + (t - T.suche) * 0.6;
    else { const u = t - T.einrasten; degRot = 4.5 + u * 0.6; degOp = 1 - eio(seg(u, 1.2, 2.2)); }
    deg.style.transform = 'rotate(' + degRot.toFixed(3) + 'deg)';
    deg.style.opacity = degOp.toFixed(3);

    // --- Ring und Himmelsrichtungen ---
    const rp = t < T.suche ? eo(seg(t, -0.3, 1.5)) : 1;
    ring.style.strokeDasharray = (rp * 100).toFixed(2) + ' 100';
    ticks.forEach((el, i) => {
      const a = 1.25 + i * 0.16;
      el.style.transform = 'scale(' + (t < T.suche ? Math.max(0, eob(seg(t, a, a + 0.45), 1.8)) : 1).toFixed(3) + ')';
      el.style.opacity = t < T.suche ? seg(t, a, a + 0.12) : 1;
    });

    // --- Nadel ---
    let ang = 45, bs = 1, sh = 1, tl = 1, bt = 1, nOp = 1;
    if (t < T.suche) nOp = 0;
    else if (t < T.einrasten) {
      const u = t - T.suche;
      bs = Math.max(0, eob(seg(u, 0.15, 0.6), 1.8)); sh = eo(seg(u, 0.35, 0.8)); tl = eo(seg(u, 0.4, 0.8)); bt = Math.max(0, eob(seg(u, 0.7, 1.0), 1.6));
      const v = Math.max(0, u - 0.95);
      const swing = 105 * Math.exp(-1.25 * v) * Math.cos(2 * Math.PI * 0.6 * v) * (1 - eio(seg(v, 2.9, 3.45)));
      ang = u < 0.95 ? lerp(-52, -60, eo(seg(u, 0, 0.95))) : 45 - swing;
    } else if (t < T.name) {
      const c = Math.max(0, t - T.einrasten - 0.12);
      ang = 45 + (t > T.einrasten + 0.12 ? 4 * Math.exp(-6 * c) * Math.sin(2 * Math.PI * 3 * c) : 0);
    } else {
      const u = t - T.name;
      ang = 45 + 1.2 * Math.sin(2 * Math.PI * u / 3.4) * seg(u, 1, 2);
    }
    needle.opacity = nOp;
    needle.transform = 'rotate(' + ang.toFixed(2) + 'deg)';
    bow.transform = 'scale(' + bs.toFixed(3) + ')';
    shaft.transform = 'scaleY(' + sh.toFixed(3) + ')';
    tail.transform = 'scaleY(' + tl.toFixed(3) + ')';
    bit.transform = 'scaleX(' + bt.toFixed(3) + ')';

    // --- Wellen beim Einrasten ---
    const ru = t - T.einrasten;
    const a1 = seg(ru, 0.14, 1.4), b1 = seg(ru, 0.42, 1.75);
    r1.setAttribute('r', lerp(250, 580, eo(a1)).toFixed(1));
    r1.setAttribute('opacity', (a1 > 0 && a1 < 1 ? 0.9 * (1 - ei(a1)) : 0).toFixed(3));
    r2.setAttribute('r', lerp(250, 520, eo(b1)).toFixed(1));
    r2.setAttribute('opacity', (b1 > 0 && b1 < 1 ? 0.45 * (1 - ei(b1)) : 0).toFixed(3));

    // --- Logo-Position und Atmen ---
    if (t < T.name) {
      let sc = breathe(t, 0.008, 3.2);
      if (t >= T.einrasten) sc *= 1 - 0.025 * Math.sin(Math.PI * seg(ru, 0.05, 0.3));
      wrap.transform = 'scale(' + sc.toFixed(4) + ')';
    } else {
      const u = t - T.name;
      const dip = 1 - 0.03 * Math.sin(Math.PI * seg(u, 0, 0.14));
      const m = eio(seg(u, 0.1, 0.95));
      const sc = lerp(1, 0.75, m) * dip * breathe(t, 0.006, 3.2);
      wrap.transform = 'translate(' + lerp(0, -500, m).toFixed(1) + 'px,0px) scale(' + sc.toFixed(4) + ')';
    }

    // --- Wortmarke, Zusatz, Claim ---
    const u = t - T.name;
    const a = seg(u, 0.45, 0.9);
    mark.opacity = eo(a).toFixed(3);
    mark.transform = 'translateX(' + lerp(34, 0, eo(a)).toFixed(1) + 'px)';
    tag.opacity = eo(seg(u, 0.7, 1.1)).toFixed(3);
    tag.letterSpacing = lerp(0.55, 0.3, eo(seg(u, 0.7, 1.5))).toFixed(3) + 'em';
    rule.transform = 'scaleX(' + eo(seg(u, 0.95, 1.3)).toFixed(3) + ')';
    claimSpans.forEach((sp, i) => {
      const p = eo(seg(u, 1.0 + i * 0.08, 1.5 + i * 0.08));
      sp.style.opacity = p.toFixed(3);
      sp.style.transform = 'translateX(' + ((1 - p) * 26).toFixed(1) + 'px)';
    });
    words.transform = 'translateX(' + lerp(0, -6, seg(u, 1.9, 5)).toFixed(2) + 'px)';
  }

  // Bühne an das Fenster anpassen
  function fit() {
    const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit); fit();

  // Abspielen
  const btn = $('replay');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start = null, raf = 0;
  function frame(now) {
    if (start === null) start = now;
    const t = Math.min(T.end, (now - start) / 1000);
    render(t);
    if (t < T.end) raf = requestAnimationFrame(frame);
    else btn.classList.add('show');
  }
  function play() {
    cancelAnimationFrame(raf); start = null; btn.classList.remove('show');
    raf = requestAnimationFrame(frame);
  }
  btn.addEventListener('click', play);

  const begin = () => { if (reduce) { render(T.end); btn.classList.add('show'); } else play(); };
  render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin); else begin();
})();
</script>
</body>
</html>
